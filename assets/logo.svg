<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128" role="img" aria-label="SMCP — Secure Model Context Protocol">
  <defs>
    <linearGradient id="smcp-logo-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g>
    <line x1="24" y1="64" x2="104" y2="64" stroke="url(#smcp-logo-grad)" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.65"/>
    <circle cx="20" cy="64" r="8" fill="url(#smcp-logo-grad)"/>
    <circle cx="108" cy="64" r="8" fill="url(#smcp-logo-grad)"/>
    <g transform="rotate(45 64 64)">
      <rect x="40" y="40" width="48" height="48" rx="12" fill="none" stroke="url(#smcp-logo-grad)" stroke-width="6"/>
    </g>
    <g fill="url(#smcp-logo-grad)">
      <circle cx="64" cy="60" r="7"/>
      <path d="M60 64 h8 l2 14 h-12 z"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="150" y="72" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#smcp-logo-grad)" letter-spacing="1">SMCP</text>
  <text x="152" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#8A8F98" letter-spacing="0.5">Secure Model Context Protocol</text>
</svg>
