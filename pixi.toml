[workspace]
channels = ["conda-forge"]
name = "smcp"
platforms = ["osx-arm64", "osx-64", "linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.11,<3.14"
duckdb = ">=1.3.2,<2"

[pypi-dependencies]
cryptography = ">=41.0.0,<46"
PyJWT = ">=2.8.0,<3"
websockets = ">=11.0.0,<16"
aiohttp = ">=3.8.0,<4"
pyyaml = ">=6.0.0,<7"
requests = ">=2.31.0,<3"
psutil = "*"
tomli = "*"
tomli-w = "*"
click = ">=8.0.0,<9"

[tasks]
# --- Tests ---
test = "pytest -q"
test-interop = "python test_v3_interop.py"
test-security = "pytest -q tests/test_security.py"
test-examples = "pytest -q tests/test_examples.py"

# --- Config ---
create-config = "python smcp_server_main.py --create-config"
validate-config = "python smcp_server_main.py --validate-only"

# --- Server / client (CLI reference implementation) ---
server = "python smcp_server_main.py"
client = "python smcp_client_main.py"
client-demo = "python smcp_client_main.py --mode demo"

# --- Examples (loopback demos; generate their own strong secrets) ---
example-server = "python examples/example_server.py"
example-client = "python examples/example_client.py"
duckdb-example = "python examples/duckdb_integration_example.py"
basic-a2a = "python examples/basic/basic_a2a_demo.py"
encrypted-a2a = "python examples/encrypted/encrypted_a2a_demo.py"

# --- Security setup tools ---
generate-ecdh-keys = "python tools/generate_ecdh_keys.py generate"
validate-ecdh-keys = "python tools/generate_ecdh_keys.py validate"

# --- Demos of the (prototype) enterprise/federated layers ---
distributed-a2a-demo = "python smcp_distributed_a2a.py"
enhanced-auth-demo = "python smcp_auth_enhanced.py"
mcp-bridge-demo = "python smcp_mcp_bridge.py"

# Heavy, optional integrations (CrewAI / MindsDB) live in the `integrations`
# environment so the default env stays small and fast to install:
#   pixi run -e integrations crewai-report-demo
[feature.integrations.pypi-dependencies]
crewai = ">=0.55.2"
mindsdb-sdk = ">=3.0.0"

[feature.integrations.tasks]
crewai-report-demo = "python examples/crewai_report_orchestration.py"
mindsdb-integration = "python examples/mindsdb_integration_example.py"

# Test tooling as its own feature so it's part of the default env.
[feature.test.pypi-dependencies]
pytest = ">=7.4"
pytest-asyncio = ">=0.21"

[environments]
default = { features = ["test"], solve-group = "default" }
integrations = { features = ["test", "integrations"], solve-group = "default" }
