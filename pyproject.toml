[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smcp"
version = "0.1.0"
description = "Secure Model Context Protocol - MCP with authentication, per-message encryption, and multi-agent (A2A) coordination"
requires-python = ">=3.11"
dependencies = [
    "websockets>=11.0",
    "cryptography>=41.0",
    "PyJWT>=2.8",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "click>=8.1",
    "requests>=2.31",
]

[tool.setuptools]
# Flat-layout repo: the protocol modules install as top-level modules so the
# internal bare imports (`from smcp_core import ...`) work identically in-repo
# and installed. Demos, connectors, and experimental modules are not packaged.
py-modules = [
    "smcp_core",
    "smcp_config",
    "smcp_server",
    "smcp_client",
    "smcp_a2a",
    "smcp_a2a_server",
    "smcp_connector_base",
]
